name: Build ISO with Payment

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '架构'
        required: true
        default: 'x86_64'
      name:
        description: '系统名称'
        required: true
        default: 'myos'
      package:
        description: '压缩包路径'
        required: true
      build_id:
        description: '构建ID'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ===== 第一步：创建订单并等待付款 =====
      - name: 创建订单并等待付款
        env:
          PID: "4146"
          KEY: "m836w016zFmc1mSq1SQW6Xmw60C1MSmZ"
          MONEY: "0.05"
          TYPE: "wxpay" # 如需支付宝改 alipay
          NOTIFY: "https://example.com/notify"
          RETURN: "https://example.com/return"
        run: |
          set -e
          OUT_TRADE_NO="elf2os-${{ inputs.build_id }}-$(date +%s)"
          NAME="elf2os-${{ inputs.name }}"
          
          echo "商户编号: $PID"

          # 获取公网 IP 作为 clientip
          CLIENT_IP=$(curl -s https://api.ipify.org || curl -s https://ifconfig.me)
          echo "客户端IP: $CLIENT_IP"

          # 1. 用 Python 严格按 ASCII 升序生成 MD5 签名（包含 clientip）
          SIGN=$(python3 -c "
          import hashlib
          params = {
              'pid': '$PID',
              'type': '$TYPE',
              'money': '$MONEY',
              'name': '$NAME',
              'out_trade_no': '$OUT_TRADE_NO',
              'notify_url': '$NOTIFY',
              'return_url': '$RETURN',
              'clientip': '$CLIENT_IP'
          }
          s = '&'.join([f'{k}={params[k]}' for k in sorted(params.keys())]) + '$KEY'
          print(hashlib.md5(s.encode('utf-8')).hexdigest())
          ")
          echo "签名: $SIGN"

          # 2. POST 创建订单（包含 clientip）
          RESP=$(curl -s -X POST "https://api.payqixiang.cn/mapi.php" \
            --data-urlencode "pid=$PID" \
            --data-urlencode "type=$TYPE" \
            --data-urlencode "money=$MONEY" \
            --data-urlencode "name=$NAME" \
            --data-urlencode "out_trade_no=$OUT_TRADE_NO" \
            --data-urlencode "notify_url=$NOTIFY" \
            --data-urlencode "return_url=$RETURN" \
            --data-urlencode "clientip=$CLIENT_IP" \
            --data-urlencode "sign=$SIGN" \
            --data-urlencode "sign_type=MD5")

          echo "创建订单返回: $RESP"

          # 提取支付链接
          PAYURL=$(echo "$RESP" | python3 -c "
          import sys,json
          try:
              d=json.load(sys.stdin)
              print(d.get('payurl','') or d.get('qrcode','') or d.get('url',''))
          except:
              print('')
          ")

          if [ -z "$PAYURL" ]; then
            echo "❌ 创建订单失败"
            exit 1
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "💰 请支付 0.05 元："
          echo "$PAYURL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # 3. 轮询等支付（最多10分钟）
          for i in $(seq 1 60); do
            sleep 10
            Q=$(curl -s "https://api.payqixiang.cn/api.php?act=order&pid=$PID&key=$KEY&out_trade_no=$OUT_TRADE_NO")
            STATUS=$(echo "$Q" | python3 -c "
            import sys,json
            try:
                print(str(json.load(sys.stdin).get('status','0')))
            except:
                print('0')
            ")
            echo "  查询($((i*10))s): status=$STATUS"
            if [ "$STATUS" = "1" ]; then
              echo "✅ 支付成功，开始构建！"
              exit 0
            fi
          done

          echo "❌ 超时未支付，构建终止"
          exit 1

      # ===== 第二步：解压压缩包 =====
      - name: Extract package
        run: |
          PKG="${{ inputs.package }}"
          mkdir -p build/input
          if [[ "$PKG" == *.zip ]]; then
            unzip -o "$PKG" -d build/input
          elif [[ "$PKG" == *.tar.gz || "$PKG" == *.tgz ]]; then
            tar -xzf "$PKG" -C build/input
          else
            echo "❌ 不支持的压缩格式"
            exit 1
          fi
          ELF=$(find build/input -name "os.elf" | head -1)
          if [ -z "$ELF" ]; then
            echo "❌ 压缩包中未找到 os.elf"
            exit 1
          fi
          echo "找到 os.elf: $ELF"

      # ===== 第三步：编译 ISO =====
      - name: Build ISO
        run: |
          ELF=$(find build/input -name "os.elf" | head -1)
          python3 elf2os.py \
            --arch "${{ inputs.arch }}" \
            --name "${{ inputs.name }}" \
            --elf "$ELF" \
            --workdir build/input \
            --output iso

      # ===== 第四步：上传 Release =====
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "build-${{ inputs.build_id }}"
          files: "*.iso"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
