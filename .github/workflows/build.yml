name: elf2os build

on:
  workflow_dispatch:
    inputs:
      arch:
        required: true
      name:
        required: true
      build_id:
        required: true
      package:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ===== 第一步：创建订单 =====
      - name: Create payment order
        id: pay
        env:
          MCHID: ${{ secrets.QIXIANG_MCHID }}
          MCHKEY: ${{ secrets.QIXIANG_MCHKEY }}
        run: |
          ORDER_ID="elf2os_$(date +%s)_$RANDOM"

          # 按七相PAY 文档拼签名
          SIGN_STR="mchid=${MCHID}&money=0.05&order_id=${ORDER_ID}&key=${MCHKEY}"
          SIGN=$(echo -n "$SIGN_STR" | md5sum | awk '{print $1}')

          RESP=$(curl -s -X POST https://api.qixiangpay.cn/mapi.php \
            -d "pid=${MCHID}" \
            -d "type=wxpay" \
            -d "out_trade_no=${ORDER_ID}" \
            -d "money=0.05" \
            -d "name=elf2os云构建" \
            -d "sign=${SIGN}" \
            -d "sign_type=MD5")

          echo "七相返回: $RESP"
          PAY_URL=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('payurl',''))")

          if [ -z "$PAY_URL" ]; then
            echo "❌ 创建订单失败"
            exit 1
          fi

          echo "order_id=$ORDER_ID" >> $GITHUB_OUTPUT
          echo "pay_url=$PAY_URL" >> $GITHUB_OUTPUT

          # 写到 Summary，用户打开 Actions 页面就能看到支付链接
          echo "## 💰 请支付 0.05 元" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 **[点击这里支付]($PAY_URL)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "支付后 Actions 会自动继续构建，无需其他操作。" >> $GITHUB_STEP_SUMMARY

      # ===== 第二步：轮询等支付 =====
      - name: Wait for payment
        env:
          ORDER_ID: ${{ steps.pay.outputs.order_id }}
          MCHID: ${{ secrets.QIXIANG_MCHID }}
          MCHKEY: ${{ secrets.QIXIANG_MCHKEY }}
        run: |
          echo "等待支付..."
          for i in $(seq 1 60); do
            sleep 10

            SIGN_STR="mchid=${MCHID}&order_id=${ORDER_ID}&key=${MCHKEY}"
            SIGN=$(echo -n "$SIGN_STR" | md5sum | awk '{print $1}')

            RESP=$(curl -s "https://api.qixiangpay.cn/api.php?act=order&pid=${MCHID}&key=${MCHKEY}&out_trade_no=${ORDER_ID}")

            STATUS=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',0))")

            if [ "$STATUS" = "1" ]; then
              echo "✅ 支付确认，开始构建"
              exit 0
            fi

            echo "  等待中... ($(( i * 10 ))秒)"
          done

          echo "❌ 超时未支付，构建终止"
          exit 1

      # ===== 第三步：解压 =====
      - name: Extract package
        run: |
          PKG="${{ inputs.package }}"
          mkdir -p build/input
          if [[ "$PKG" == *.zip ]]; then
            unzip -o "$PKG" -d build/input
          elif [[ "$PKG" == *.tar.gz || "$PKG" == *.tgz ]]; then
            tar -xzf "$PKG" -C build/input
          fi

          ELF=$(find build/input -name "os.elf" | head -1)
          if [ -z "$ELF" ]; then
            echo "❌ 压缩包中未找到 os.elf"
            exit 1
          fi
          echo "找到 os.elf: $ELF"

      # ===== 第四步：编译 ISO =====
      - name: Build ISO
        run: |
          ELF=$(find build/input -name "os.elf" | head -1)
          python3 elf2os.py \
            --arch "${{ inputs.arch }}" \
            --name "${{ inputs.name }}" \
            --elf "$ELF" \
            --workdir build/input \
            --output iso

      # ===== 第五步：上传 Release =====
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          files: "*.iso"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
