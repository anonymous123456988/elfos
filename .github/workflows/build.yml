name: elf2os build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '架构'
        required: true
        default: 'x86_64'
      name:
        description: 'OS名称'
        required: true
        default: 'myos'
      build_id:
        description: '构建ID'
        required: true
      package:
        description: '压缩包路径（仓库内相对路径）'
        required: true
      out_trade_no:
        description: '商户订单号（网页提前创建）'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ============================================================
      # 等待支付（订单已由网页提前创建，支付方式固定支付宝）
      # ============================================================
      - name: 等待支付
        run: |
          set -e
          PID="4146"
          KEY="m836w016zFmc1mSq1SQW6Xmw60C1MSmZ"
          OUT_TRADE_NO="${{ inputs.out_trade_no }}"

          echo "订单号: $OUT_TRADE_NO"
          echo "开始轮询支付状态（最多10分钟）..."

          for i in $(seq 1 60); do
            sleep 10
            Q=$(curl -s "https://api.payqixiang.cn/api.php?act=order&pid=$PID&key=$KEY&out_trade_no=$OUT_TRADE_NO")
            STATUS=$(python3 -c "import json,sys; print(json.loads(sys.stdin.read()).get('status','0'))" <<< "$Q")
            echo "  轮询 ${i}: status=$STATUS"
            if [ "$STATUS" = "1" ]; then
              echo "✅ 支付成功，开始构建！"
              exit 0
            fi
          done

          echo "❌ 超时未支付，构建终止"
          exit 1

      # ============================================================
      # 解压
      # ============================================================
      - name: Extract package
        run: |
          PKG="${{ inputs.package }}"
          mkdir -p build/input
          if [[ "$PKG" == *.zip ]]; then
            unzip -o "$PKG" -d build/input
          elif [[ "$PKG" == *.tar.gz || "$PKG" == *.tgz ]]; then
            tar -xzf "$PKG" -C build/input
          else
            echo "❌ 不支持的压缩格式"
            exit 1
          fi
          ELF=$(find build/input -name "os.elf" | head -1)
          if [ -z "$ELF" ]; then
            echo "❌ 压缩包中未找到 os.elf"
            exit 1
          fi
          echo "找到 os.elf: $ELF"

      # ============================================================
      # 编译 ISO
      # ============================================================
      - name: Build ISO
        run: |
          ELF=$(find build/input -name "os.elf" | head -1)
          mkdir -p build/output
          python3 elf2os.py \
            --arch "${{ inputs.arch }}" \
            --名称 "${{ inputs.name }}" \
            --elf "$ELF" \
            --输出 "build/output/${{ inputs.name }}.iso"

      # ============================================================
      # 上传 Release
      # ============================================================
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "build-${{ inputs.build_id }}"
          files: "build/output/*.iso"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
