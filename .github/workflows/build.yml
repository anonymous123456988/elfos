name: elf2os build

on:
  workflow_dispatch:
    inputs:
      arch:
        required: true
        description: "架构 (x86_64/riscv64等)"
      name:
        required: true
        description: "OS名称"
      build_id:
        required: true
        description: "构建ID"
      package:
        required: true
        description: "压缩包路径"

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create Order & Wait Payment
        id: pay
        env:
          PID: ${{ secrets.QIXIANG_PID }}
          KEY: ${{ secrets.QIXIANG_KEY }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -e
          MONEY="0.05"
          NAME="elf2os-${BUILD_ID}"
          OUT_TRADE_NO="elf2os_${BUILD_ID}_$(date +%s)"
          NOTIFY_URL="https://example.com/notify"  # 用不到但必填，随便填
          RETURN_URL="https://example.com/return"
          TYPE="alipay"  # 默认支付宝，可改 wxpay

          # ===== 1. 创建订单（mapi.php 返回JSON）=====
          # MD5签名：参数升序拼接 + key
          SIGN_STR="money=${MONEY}&name=${NAME}&notify_url=${NOTIFY_URL}&out_trade_no=${OUT_TRADE_NO}&pid=${PID}&return_url=${RETURN_URL}&type=${TYPE}${KEY}"
          SIGN=$(echo -n "$SIGN_STR" | md5sum | awk '{print $1}')

          RESP=$(curl -s "https://api.payqixiang.cn/mapi.php" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "pid=${PID}&type=${TYPE}&out_trade_no=${OUT_TRADE_NO}&name=${NAME}&money=${MONEY}&notify_url=${NOTIFY_URL}&return_url=${RETURN_URL}&sign=${SIGN}&sign_type=MD5")

          echo "创建订单返回: $RESP"
          PAYURL=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('payurl','') or d.get('qrcode',''))" 2>/dev/null || echo "")
          if [ -z "$PAYURL" ]; then
            echo "❌ 创建订单失败，请检查签名/参数"
            exit 1
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "💰 请支付 0.05 元："
          echo "$PAYURL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "PAYURL=$PAYURL" >> $GITHUB_OUTPUT
          echo "OUT_TRADE_NO=$OUT_TRADE_NO" >> $GITHUB_OUTPUT

          # ===== 2. 轮询查询订单（最多10分钟）=====
          for i in $(seq 1 60); do
            sleep 10
            # 查询接口：api.php?act=order&pid=&key=&out_trade_no=
            Q=$(curl -s "https://api.payqixiang.cn/api.php?act=order&pid=${PID}&key=${KEY}&out_trade_no=${OUT_TRADE_NO}")
            STATUS=$(echo "$Q" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','0'))" 2>/dev/null || echo "0")
            echo "  查询($((i*10))s): status=$STATUS"
            if [ "$STATUS" = "1" ]; then
              echo "✅ 支付成功，开始构建！"
              exit 0
            fi
          done
          echo "❌ 超时未支付，构建终止"
          exit 1

      - name: Extract package
        run: |
          PKG="${{ inputs.package }}"
          mkdir -p build/input
          if [[ "$PKG" == *.zip ]]; then unzip -o "$PKG" -d build/input; else tar -xzf "$PKG" -d build/input; fi
          ELF=$(find build/input -name "os.elf" | head -1)
          [ -z "$ELF" ] && { echo "❌ 未找到 os.elf"; exit 1; }
          echo "ELF=$ELF"

      - name: Build ISO
        run: |
          ELF=$(find build/input -name "os.elf" | head -1)
          python3 elf2os.py --arch "${{ inputs.arch }}" --name "${{ inputs.name }}" --elf "$ELF" --workdir build/input --output iso

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "build-${{ inputs.build_id }}"
          files: "*.iso"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
