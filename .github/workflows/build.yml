name: elf2os build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '架构'
        required: true
        default: 'x86_64'
      name:
        description: 'OS名称'
        required: true
        default: 'myos'
      build_id:
        description: '构建ID'
        required: true
      package:
        description: '压缩包路径'
        required: true
      out_trade_no:
        description: '商户订单号（网页自动生成）'
        required: true

env:
  PID: '4146'
  KEY: 'm836w016zFmc1mSq1SQW6Xmw60C1MSmZ'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ============================================================
      # 轮询等待支付（不写任何文件，避免 git push 403）
      # 网页端通过 Jobs API 的 step 名称实时感知此阶段并展示支付链接
      # ============================================================
      - name: 等待支付
        run: |
          set -e
          echo "开始轮询支付状态（最多10分钟）..."
          for i in $(seq 1 60); do
            sleep 10
            RESP=$(curl -s "https://api.payqixiang.cn/api.php?act=order&pid=$PID&key=$KEY&out_trade_no=${{ inputs.out_trade_no }}")
            STATUS=$(echo "$RESP" | python3 -c 'import json,sys; print(json.loads(sys.stdin.read()).get("status","0"))')
            echo "  轮询 ${i}: status=$STATUS"
            if [ "$STATUS" = "1" ]; then
              echo "✅ 支付成功！"
              exit 0
            fi
          done
          echo "❌ 超时未支付"
          exit 1

      # ============================================================
      # 解压压缩包
      # ============================================================
      - name: 解压压缩包
        run: |
          mkdir -p build/input build/output
          if [[ "${{ inputs.package }}" == *.zip ]]; then
            unzip -o "${{ inputs.package }}" -d build/input
          elif [[ "${{ inputs.package }}" == *.tar.gz || "${{ inputs.package }}" == *.tgz ]]; then
            tar -xzf "${{ inputs.package }}" -C build/input
          else
            echo "❌ 不支持的格式"
            exit 1
          fi
          ELF=$(find build/input -name "os.elf" | head -1)
          if [ -z "$ELF" ]; then
            echo "❌ 未找到 os.elf"
            exit 1
          fi
          echo "找到: $ELF"

      # ============================================================
      # 编译 ISO
      # --output 为格式选择：iso / bin / both（不是文件路径）
      # ============================================================
      - name: 编译 ISO
        run: |
          ELF=$(find build/input -name "os.elf" | head -1)
          python3 elf2os.py \
            --arch "${{ inputs.arch }}" \
            --name "${{ inputs.name }}" \
            --elf "$ELF" \
            --output "iso"

      # ============================================================
      # 上传 Release（用通配符，匹配脚本自行命名的输出文件）
      # ============================================================
      - name: 上传 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "build-${{ inputs.build_id }}"
          files: "build/output/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
