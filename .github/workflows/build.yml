name: elf2os build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        required: true
        default: "x86_64"
      name:
        description: "OS name (--name)"
        required: true
        default: "myos"
      build_id:
        description: "Build / package identifier (matches uploaded elf/<build_id>.pkg*)"
        required: true
        default: "myos"
      package:
        description: "Path to uploaded package, e.g. elf/<build_id>.pkg.zip"
        required: false
        default: ""

permissions:
  contents: write   # 用于创建 Release / 推送产物

env:
  PKG_PATH: ${{ inputs.package || format('elf/{0}.pkg.zip', inputs.build_id) }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Verify package exists
        run: |
          echo "Looking for package at: $PKG_PATH"
          ls -la "$PKG_PATH" || {
            echo "::error::压缩包未找到：$PKG_PATH。请确认上传的压缩包路径与 build_id 一致，且位于 elf/ 目录下。"
            exit 1
          }

      # ===== 解压：根据扩展名自动选择 unzip / tar =====
      - name: Extract package (auto detect os.elf)
        run: |
          set -e
          mkdir -p build/input
          echo ">>> Extracting $PKG_PATH"
          case "$PKG_PATH" in
            *.zip)
              # -o 自动覆盖；列出内容便于定位 os.elf
              unzip -o "$PKG_PATH" -d build/input
              ;;
            *.tar.gz|*.tgz)
              tar -xzf "$PKG_PATH" -C build/input
              ;;
            *)
              echo "::error::不支持的压缩格式，仅支持 .zip / .tar.gz / .tgz"
              exit 1
              ;;
          esac

          echo ">>> Package contents:"
          find build/input -type f | tee /tmp/files.txt

      # ===== 强制要求压缩包内必须含 os.elf =====
      - name: Locate os.elf
        id: elf
        run: |
          set -e
          ELF=$(find build/input -type f -name "os.elf" | head -n 1)
          if [ -z "$ELF" ]; then
            echo "::error::压缩包中未找到 os.elf。请确认压缩包根目录或子目录内存在 os.elf 文件。"
            echo "已扫描的文件："
            cat /tmp/files.txt
            exit 1
          fi
          echo "Found os.elf at: $ELF"
          echo "elf_path=$ELF" >> "$GITHUB_OUTPUT"
          echo "elf_dir=$(dirname "$ELF")" >> "$GITHUB_OUTPUT"

      # ===== 准备构建环境（按你的 elf2os.py 实际依赖调整）=====
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          # 常见 ISO 构建工具；如你的 elf2os.py 用 xorriso/genisoimage 请保留
          sudo apt-get install -y --no-install-recommends \
            xorriso \
            genisoimage \
            mtools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            || true
          # Python 依赖（如 elf2os.py 需要）
          pip install -r requirements.txt || true

      # ===== 调用你的构建脚本 =====
      # 约定：elf2os.py 接收 --arch / --name / --elf / --out
      # 如你的参数名不同，按实际修改下面这一行即可
      - name: Run elf2os.py → build ISO
        run: |
          set -e
          mkdir -p build/out
          python3 elf2os.py \
            --arch "${{ inputs.arch }}" \
            --name "${{ inputs.name }}" \
            --elf "${{ steps.elf.outputs.elf_path }}" \
            --workdir build/input \
            --out "build/out/${{ inputs.name }}-${{ inputs.arch }}.iso"

          echo ">>> Output ISO:"
          ls -lh build/out/

      # ===== 发布 Release（自动生成 tag + 上传 ISO）=====
      - name: Upload ISO to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.build_id }}-${{ github.run_number }}
          name: "Build ${{ inputs.name }} (${{ inputs.arch }}) #${{ github.run_number }}"
          body: |
            - arch: ${{ inputs.arch }}
            - name: ${{ inputs.name }}
            - build_id: ${{ inputs.build_id }}
            - commit: ${{ github.sha }}
          files: |
            build/out/*.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Done
        run: echo "✅ ISO 已发布到 Releases"
