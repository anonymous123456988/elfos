name: elf2os build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 目标架构
        type: choice
        options: [x86_64, aarch64, riscv64, i386, arm64, arm, ppc64le, mips64]
        default: x86_64
      name:
        description: 操作系统名称
        type: string
        default: myos
      build_id:
        description: 构建标识（对应 elf/ 下的 ELF 文件名，不含扩展名）
        type: string
        default: myos

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc flex bison libssl-dev libelf-dev \
            wget cpio gzip xz-utils tar \
            grub-common grub-pc-bin grub-efi-amd64-bin \
            gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu gcc-i686-linux-gnu \
            gcc-arm-linux-gnueabihf gcc-powerpc64le-linux-gnu gcc-mips64-linux-gnuabi64 \
            python3 python3-pip qemu-user-static

      - name: Check user ELF
        run: |
          mkdir -p elf
          BUILD_ID="${{ inputs.build_id }}"
          if [ -f "elf/${BUILD_ID}.elf" ]; then
            echo "ELF_PATH=elf/${BUILD_ID}.elf" >> $GITHUB_ENV
            echo "::notice::使用用户 ELF: elf/${BUILD_ID}.elf"
          else
            echo "::notice::未提供 ${BUILD_ID}.elf，将仅编译内核"
          fi

      - name: Run elf2os
        env:
          SUDO_PASSWORD: ""
        run: |
          ARCH="${{ inputs.arch }}"
          NAME="${{ inputs.name }}"
          EXTRA=""
          if [ -n "$ELF_PATH" ]; then EXTRA="--elf $ELF_PATH"; fi

          # 关键：--cli 强制命令行模式，--name 用你脚本的真实参数名
          python3 elf2os.py \
            --cli \
            --arch "$ARCH" \
            --name "$NAME" \
            --output iso \
            $EXTRA

      - name: Collect ISO
        id: collect
        run: |
          ARCH="${{ inputs.arch }}"
          NAME="${{ inputs.name }}"
          # 产物路径：按你脚本实际输出调整
          ISO_PATH=$(find os/$ARCH -maxdepth 1 -name "${NAME}*.iso" 2>/dev/null | head -n1)
          if [ -z "$ISO_PATH" ]; then
            echo "::error::未找到 ISO 产物，列出 os/ 目录内容："
            find os -type f | head -50
            exit 1
          fi
          echo "iso=$ISO_PATH" >> $GITHUB_OUTPUT
          echo "name=$(basename $ISO_PATH)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.build_id }}-${{ github.run_number }}
          name: Build ${{ inputs.build_id }} (${{ inputs.arch }})
          files: ${{ steps.collect.outputs.iso }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: elf2os-${{ inputs.arch }}-${{ inputs.build_id }}
          path: ${{ steps.collect.outputs.iso }}
