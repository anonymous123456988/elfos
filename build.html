<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>elf2os 在线构建</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 640px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
  .card { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  h2 { margin-top: 0; }
  label { display: block; margin-top: 14px; font-size: 14px; color: #333; }
  input { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
  button { width: 100%; padding: 12px; margin-top: 20px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
  .btn-primary { background: #007bff; color: #fff; }
  .btn-primary:disabled { background: #aaa; cursor: not-allowed; }
  .btn-success { background: #28a745; color: #fff; }
  .btn-success:disabled { background: #aaa; cursor: not-allowed; }
  #payurl { margin-top: 16px; padding: 12px; background: #e8f4fd; border-radius: 6px; word-break: break-all; font-size: 13px; }
  #payurl a { color: #007bff; }
  /* 进度条 */
  .progress-wrap { margin-top: 20px; display: none; }
  .progress-bar { height: 24px; background: #e9ecef; border-radius: 12px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #007bff, #28a745); border-radius: 12px; width: 0%; transition: width 1s ease; }
  .progress-text { text-align: center; margin-top: 8px; font-size: 14px; color: #555; }
  .status-msg { margin-top: 16px; padding: 12px; border-radius: 6px; font-size: 14px; }
  .status-info { background: #d1ecf1; color: #0c5460; }
  .status-success { background: #d4edda; color: #155724; }
  .status-error { background: #f8d7da; color: #721c24; }
  .download-link { display: inline-block; margin-top: 8px; padding: 10px 20px; background: #28a745; color: #fff; text-decoration: none; border-radius: 6px; }
  .download-link:hover { background: #218838; }
</style>
</head>
<body>

<div class="card">
  <h2>🛠 elf2os 在线构建</h2>

  <label>架构 <input id="arch" value="x86_64"></label>
  <label>OS 名称 <input id="name" value="myos"></label>
  <label>构建 ID <input id="build_id" value="v1"></label>
  <label>压缩包路径 <input id="package" value="elf/v1.pkg.zip"></label>

  <button class="btn-primary" onclick="createOrder()" id="btnOrder">1. 生成支付订单</button>

  <div id="payurl"></div>

  <button class="btn-success" onclick="triggerBuild()" id="btnBuild" disabled>2. 开始构建（先完成支付）</button>

  <!-- 进度条 -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-text" id="progressText">等待中...</div>
  </div>

  <div id="statusMsg"></div>
</div>

<script>
const REPO = '你的用户名/你的仓库名'; // ← 改成你的
const PID = '4146';
const KEY = 'm836w016zFmc1mSq1SQW6Xmw60C1MSmZ';

let currentOutTradeNo = '';
let pollTimer = null;

// ==================== MD5 ====================
async function md5(str) {
  const buf = new TextEncoder().encode(str);
  const digest = await crypto.subtle.digest('MD5', buf);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2,'0')).join('');
}

// ==================== 创建订单 ====================
async function createOrder() {
  setStatus('正在创建订单...', 'info');
  document.getElementById('btnOrder').disabled = true;

  const outTradeNo = 'elf2os-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6);
  const name = document.getElementById('name').value || 'myos';
  const money = '0.05';
  const type = 'alipay';
  const notify = 'https://example.com/notify';
  const ret = 'https://example.com/return';
  const clientip = '127.0.0.1';

  const params = { name, notify_url: notify, out_trade_no: outTradeNo, pid: PID, return_url: ret, type, money, clientip };
  const sorted = Object.keys(params).sort().map(k => k + '=' + params[k]).join('&') + KEY;
  const sign = await md5(sorted);

  const body = new URLSearchParams({ ...params, sign, sign_type: 'MD5' });

  try {
    const resp = await fetch('https://api.payqixiang.cn/mapi.php', { method: 'POST', body });
    const data = await resp.json();

    if (data.code == 1 && data.payurl) {
      currentOutTradeNo = outTradeNo;
      document.getElementById('payurl').innerHTML =
        '✅ 订单已创建，<a href="' + data.payurl + '" target="_blank">点击此处跳转支付</a><br>支付完成后点击下方"开始构建"';
      document.getElementById('btnBuild').disabled = false;
      setStatus('请完成支付后再继续', 'info');
    } else {
      setStatus('❌ 创建失败: ' + (data.msg || JSON.stringify(data)), 'error');
      document.getElementById('btnOrder').disabled = false;
    }
  } catch(e) {
    setStatus('❌ 请求失败: ' + e, 'error');
    document.getElementById('btnOrder').disabled = false;
  }
}

// ==================== 触发构建 ====================
async function triggerBuild() {
  const token = prompt('请输入 GitHub Classic PAT（需有 workflow 权限）：');
  if (!token) return;

  document.getElementById('btnBuild').disabled = true;
  document.getElementById('progressWrap').style.display = 'block';
  updateProgress(10, '正在触发构建...');

  const payload = {
    ref: 'main',
    inputs: {
      arch: document.getElementById('arch').value,
      name: document.getElementById('name').value,
      build_id: document.getElementById('build_id').value,
      package: document.getElementById('package').value,
      out_trade_no: currentOutTradeNo
    }
  };

  try {
    const resp = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/build.yml/dispatches`, {
      method: 'POST',
      headers: {
        'Authorization': 'token ' + token,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });

    if (resp.status === 204) {
      updateProgress(20, '构建已触发，等待 Actions 启动...');
      setStatus('构建已触发，正在轮询状态...', 'info');
      // 开始轮询
      pollStatus(token);
    } else {
      const d = await resp.json();
      setStatus('❌ 触发失败: ' + d.message, 'error');
      document.getElementById('btnBuild').disabled = false;
    }
  } catch(e) {
    setStatus('❌ 触发失败: ' + e, 'error');
    document.getElementById('btnBuild').disabled = false;
  }
}

// ==================== 轮询 Actions 状态 ====================
async function pollStatus(token) {
  let attempt = 0;
  pollTimer = setInterval(async () => {
    attempt++;
    try {
      // 获取最新一次运行
      const resp = await fetch(`https://api.github.com/repos/${REPO}/actions/runs?per_page=1`, {
        headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json' }
      });
      const data = await resp.json();
      if (!data.workflow_runs || data.workflow_runs.length === 0) return;

      const run = data.workflow_runs[0];
      const status = run.status; // queued / in_progress / completed
      const conclusion = run.conclusion; // success / failure / cancelled

      if (status === 'queued') {
        updateProgress(30, '排队中...');
      } else if (status === 'in_progress') {
        updateProgress(50 + Math.min(attempt * 2, 40), '正在构建 ISO...');
      } else if (status === 'completed') {
        clearInterval(pollTimer);
        if (conclusion === 'success') {
          updateProgress(100, '构建成功！');
          setStatus('✅ 构建完成！', 'success');
          // 获取 Release 下载链接
          fetchRelease(token, run.id);
        } else {
          updateProgress(100, '构建失败');
          setStatus('❌ 构建失败，请查看 <a href="' + run.html_url + '" target="_blank">Actions 日志</a>', 'error');
        }
      }
    } catch(e) {
      // 静默重试
    }
  }, 8000);
}

// ==================== 获取 Release 下载链接 ====================
async function fetchRelease(token, runId) {
  try {
    const resp = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`, {
      headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json' }
    });
    const data = await resp.json();
    if (data.assets && data.assets.length > 0) {
      const asset = data.assets[0];
      const msg = document.getElementById('statusMsg');
      msg.className = 'status-msg status-success';
      msg.innerHTML = '✅ 构建成功！<br><a class="download-link" href="' + asset.browser_download_url + '" download>📥 下载 ' + asset.name + '</a>';
    } else {
      setStatus('✅ 构建成功，但未找到 Release 文件。', 'success');
    }
  } catch(e) {
    setStatus('✅ 构建成功，但获取下载链接失败。', 'success');
  }
}

// ==================== 工具函数 ====================
function updateProgress(pct, text) {
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = text;
}

function setStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.className = 'status-msg status-' + type;
  el.innerHTML = msg;
}
</script>

</body>
</html>
