<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>elf2os 在线构建</title>
<style>
body{font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f6f8fa;margin:0;padding:16px}
.box{background:#fff;padding:32px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.08);max-width:540px;width:100%}
h2{margin-top:0;margin-bottom:4px}
label{display:block;margin:12px 0 4px;font-size:13px;color:#57606a}
select,input[type=text],input[type=file]{width:100%;padding:9px;border:1px solid #d0d7de;border-radius:6px;box-sizing:border-box}
input.pat{font-family:monospace;font-size:13px}
button{padding:11px 22px;background:#1f883d;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;margin-top:16px}
button:hover{background:#1a7f37}
button:disabled{background:#94d3a2;cursor:not-allowed}
.log{margin-top:16px;font-size:13px;color:#57606a;white-space:pre-wrap;max-height:280px;overflow:auto;background:#f6f8fa;padding:10px;border-radius:6px}
.err{color:#cf222e}
.ok{color:#1a7f37}
.hint{font-size:12px;color:#57606a;margin-top:6px}
.pat-link{font-size:13px;color:#0969da;text-decoration:none;font-weight:600}
.pat-link:hover{text-decoration:underline}
a.acts{color:#0969da;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <h2>🛠️ elf2os 在线构建</h2>
  <div class="hint" style="margin-bottom:14px">每次构建需支付 <b>¥0.05</b>，支付后在 Actions 页面自动继续编译。</div>
  <div id="area"></div>
</div>
<script>
const REPO = "anonymous123456988/elfos";

const savedPat = localStorage.getItem("elfos_pat");
const area = document.getElementById("area");

if (!savedPat) {
  area.innerHTML = `
    <label>GitHub Classic PAT（仅需一次）</label>
    <input id="pat" class="pat" type="password" placeholder="ghp_xxx 或 github_pat_xxx">
    <div class="hint">用你自己的账号创建，勾 <b>repo</b> + <b>workflow</b> 权限。PAT 仅存浏览器本地，不会上传。</div>
    <div class="hint">还没有？<a class="pat-link" href="https://github.com/settings/tokens/new?name=elf2os-build&expiration=90days&scopes[]=repo&scopes[]=workflow&target=personal" target="_blank" rel="noopener">点击一键创建 →</a></div>
    <button onclick="savePat()">保存并继续</button>
    <div class="log" id="log"></div>`;
} else {
  area.innerHTML = `
    <div class="hint" style="margin-bottom:12px">✅ 已授权 <a href="#" onclick="logout()" style="float:right;font-size:12px">切换账号</a></div>
    <label>架构</label>
    <select id="arch">
      <option value="x86_64">x86_64</option>
      <option value="aarch64">AArch64 (ARM64)</option>
      <option value="riscv64">RISC-V 64</option>
      <option value="i386">i386 (x86 32-bit)</option>
    </select>
    <label>OS 名称</label>
    <input id="os_name" type="text" value="myos">
    <label>build_id（对应压缩包内文件名前缀，留空则用 OS 名称）</label>
    <input id="build_id" type="text" placeholder="如 v1">
    <label>压缩包（必须包含 os.elf，支持 .zip / .tar.gz / .tgz）</label>
    <input id="elfpkg" type="file" accept=".zip,.tar.gz,.tgz">
    <button id="btn" onclick="startBuild()">构建（¥0.05 / 次）</button>
    <div class="log" id="log">就绪。填写后点构建。</div>`;
}

function savePat() {
  const v = document.getElementById("pat").value.trim();
  if (!v) return;
  localStorage.setItem("elfos_pat", v);
  location.reload();
}
function logout() {
  localStorage.removeItem("elfos_pat");
  location.reload();
  return false;
}

function api(path, opts={}) {
  return fetch("https://api.github.com" + path, {
    ...opts,
    headers: {
      "Authorization": "Bearer " + localStorage.getItem("elfos_pat"),
      "Accept": "application/vnd.github+json",
      ...(opts.headers||{})
    }
  });
}

function log(msg, cls) {
  const e = document.getElementById("log");
  if (!e) return;
  e.textContent += msg + "\n";
  if (cls) e.className = "log " + cls;
}

// FileReader 转 base64（不爆栈）
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(",")[1]);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(file);
  });
}

async function startBuild() {
  const btn = document.getElementById("btn");
  btn.disabled = true;
  log("");

  const arch = document.getElementById("arch").value;
  const os_name = document.getElementById("os_name").value || "myos";
  const build_id = document.getElementById("build_id").value || os_name;
  const pkgFile = document.getElementById("elfpkg").files[0];

  if (!pkgFile) {
    log("❌ 请先选择压缩包", "err");
    btn.disabled = false;
    return;
  }

  try {
    // 1. 确认仓库（fork 或用自己的）
    log("① 检查仓库...");
    let forkName = REPO;
    const me = await api("/user").then(r => r.json());
    const myFork = `${me.login}/elfos`;
    const check = await api(`/repos/${myFork}`);
    if (check.ok) {
      forkName = myFork;
      log("  使用已有 fork: " + forkName, "ok");
    } else {
      log("  Fork 中...");
      const f = await api(`/repos/${REPO}/forks`, {method:"POST"});
      if (!f.ok) throw new Error("Fork 失败: " + (await f.json()).message);
      forkName = myFork;
      log("  Fork 成功: " + forkName, "ok");
      await new Promise(r => setTimeout(r, 6000));
    }

    // 2. 上传压缩包
    log("② 上传压缩包...");
    const b64 = await fileToBase64(pkgFile);
    const pkgPath = `elf/${build_id}.pkg${pkgFile.name.substring(pkgFile.name.lastIndexOf("."))}`;
    let sha = null;
    const exist = await api(`/repos/${forkName}/contents/${pkgPath}?ref=main`);
    if (exist.ok) sha = (await exist.json()).sha;
    const put = await api(`/repos/${forkName}/contents/${pkgPath}`, {
      method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        message: "elf2os: upload package " + build_id,
        branch: "main",
        content: b64,
        sha: sha
      })
    });
    if (!put.ok) throw new Error("上传失败: " + (await put.json()).message);
    log("  ✓ 已上传: " + pkgPath, "ok");

    // 3. 触发 build.yml
    log("③ 触发构建（含支付验证）...");
    const disp = await api(`/repos/${forkName}/actions/workflows/build.yml/dispatches`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        ref: "main",
        inputs: { arch, name: os_name, build_id, package: pkgPath }
      })
    });
    if (disp.status !== 204) throw new Error("触发失败: " + disp.status);
    log("  ✓ 已触发！", "ok");

    // 4. 等 workflow 出现，给出链接
    log("④ 等待 Actions 启动...");
    for (let i = 0; i < 12; i++) {
      await new Promise(r => setTimeout(r, 5000));
      const runs = await api(`/repos/${forkName}/actions/runs?per_page=3`).then(r => r.json());
      const run = runs.workflow_runs && runs.workflow_runs.find(r => r.name === "elf2os build");
      if (run) {
        log("");
        log("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━", "ok");
        log("👉 打开下方链接查看支付页面：", "ok");
        log("");
        area.innerHTML += `<p style="margin-top:10px"><a class="acts" href="${run.html_url}" target="_blank">${run.html_url}</a></p>`;
        log("");
        log("付完 0.05 元后 Actions 自动继续，ISO 将发布到 Releases。", "ok");
        return;
      }
      log("  等待中...");
    }
    log("⏱️ 未检测到 workflow，请手动查看 Actions 页", "err");

  } catch (e) {
    log("❌ " + e.message, "err");
    btn.disabled = false;
  }
}
</script>
</body>
</html>
