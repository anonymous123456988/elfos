<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>elf2os 在线构建</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
  label { display: block; margin-top: 12px; }
  input, button { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
  button { background: #007bff; color: #fff; border: none; cursor: pointer; margin-top: 16px; }
  button:hover { background: #0056b3; }
  button:disabled { background: #aaa; cursor: not-allowed; }
  #payurl { margin-top: 16px; padding: 12px; background: #f0f0f0; word-break: break-all; }
  #status { margin-top: 12px; color: #333; }
  /* 进度条 */
  #progressWrap { margin-top: 16px; display: none; }
  #progressBar { width: 100%; height: 24px; background: #eee; border-radius: 12px; overflow: hidden; }
  #progressFill { height: 100%; width: 0%; background: #28a745; transition: width 0.5s; text-align: center; line-height: 24px; color: #fff; font-size: 13px; }
  #progressText { margin-top: 6px; font-size: 14px; color: #555; }
  /* 下载链接 */
  #downloadArea { margin-top: 16px; display: none; padding: 16px; background: #d4edda; border-radius: 8px; }
  #downloadArea a { display: inline-block; padding: 10px 20px; background: #28a745; color: #fff; text-decoration: none; border-radius: 6px; }
  #downloadArea a:hover { background: #1e7e34; }
</style>
</head>
<body>

<h2>elf2os 在线构建</h2>

<label>架构 <input id="arch" value="x86_64"></label>
<label>OS名称 <input id="name" value="myos"></label>
<label>构建ID <input id="build_id" value="v1"></label>
<label>压缩包路径 <input id="package" value="elf/v1.pkg.zip"></label>

<button onclick="createOrder()">1. 生成支付订单</button>

<div id="status"></div>
<div id="payurl"></div>

<button onclick="triggerBuild()" id="buildBtn" disabled>2. 开始构建（先完成支付）</button>

<!-- 进度条 -->
<div id="progressWrap">
  <div id="progressBar"><div id="progressFill">0%</div></div>
  <div id="progressText">等待触发...</div>
</div>

<!-- 下载区域 -->
<div id="downloadArea">
  <div style="margin-bottom:8px;">✅ 构建成功！点击下载：</div>
  <a id="downloadLink" href="#" target="_blank">下载 ISO</a>
</div>

<script>
let currentOutTradeNo = '';
let pollTimer = null;
let runId = null;
const REPO = '你的用户名/你的仓库名'; // ← 改成你的仓库

const PID = '4146';
const KEY = 'm836w016zFmc1mSq1SQW6Xmw60C1MSmZ';

// MD5
async function md5(str) {
  const buf = new TextEncoder().encode(str);
  const digest = await crypto.subtle.digest('MD5', buf);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2,'0')).join('');
}

// ── 1. 创建订单 ──
async function createOrder() {
  document.getElementById('status').textContent = '正在创建订单...';
  document.getElementById('downloadArea').style.display = 'none';

  const outTradeNo = 'elf2os-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6);
  const name = document.getElementById('name').value || 'myos';
  const money = '0.05';
  const type = 'alipay';
  const notify = 'https://example.com/notify';
  const ret = 'https://example.com/return';
  const clientip = '127.0.0.1';

  const params = { name, notify_url: notify, out_trade_no: outTradeNo, pid: PID, return_url: ret, type, money, clientip };
  const sorted = Object.keys(params).sort().map(k => k + '=' + params[k]).join('&') + KEY;
  const sign = await md5(sorted);

  const body = new URLSearchParams({ ...params, sign, sign_type: 'MD5' });

  const resp = await fetch('https://api.payqixiang.cn/mapi.php', { method: 'POST', body });
  const data = await resp.json();

  if (data.code == 1 && data.payurl) {
    currentOutTradeNo = outTradeNo;
    document.getElementById('status').textContent = '✅ 订单创建成功！请点击下方链接支付：';
    document.getElementById('payurl').innerHTML = '<a href="' + data.payurl + '" target="_blank">' + data.payurl + '</a><br><br>支付完成后点击"开始构建"';
    document.getElementById('buildBtn').disabled = false;
  } else {
    document.getElementById('status').textContent = '❌ 创建失败: ' + (data.msg || JSON.stringify(data));
  }
}

// ── 2. 触发构建 ──
async function triggerBuild() {
  if (!currentOutTradeNo) { alert('请先生成订单'); return; }

  const token = prompt('请输入 GitHub Classic PAT（需要有 workflow 权限）：');
  if (!token) return;

  document.getElementById('status').textContent = '正在触发构建...';
  document.getElementById('progressWrap').style.display = 'block';
  setProgress(5, '正在触发 Actions...');
  document.getElementById('downloadArea').style.display = 'none';

  const payload = {
    ref: 'main',
    inputs: {
      arch: document.getElementById('arch').value,
      name: document.getElementById('name').value,
      build_id: document.getElementById('build_id').value,
      package: document.getElementById('package').value,
      out_trade_no: currentOutTradeNo
    }
  };

  const resp = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/build.yml/dispatches`, {
    method: 'POST',
    headers: {
      'Authorization': 'token ' + token,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(payload)
  });

  if (resp.status === 204) {
    document.getElementById('status').textContent = '✅ 构建已触发！正在轮询进度...';
    setProgress(10, '已触发，等待 Actions 调度...');
    // 等几秒后开始轮询
    setTimeout(() => pollRunStatus(token), 5000);
  } else {
    const d = await resp.json();
    document.getElementById('status').textContent = '❌ 触发失败: ' + d.message;
    setProgress(0, '触发失败');
  }
}

// ── 3. 轮询 Actions 运行状态 ──
async function pollRunStatus(token) {
  try {
    // 获取最新一次 run
    const resp = await fetch(`https://api.github.com/repos/${REPO}/actions/runs?per_page=1`, {
      headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json' }
    });
    const data = await resp.json();
    if (!data.workflow_runs || data.workflow_runs.length === 0) {
      setProgress(0, '未找到运行记录');
      return;
    }

    const run = data.workflow_runs[0];
    runId = run.id;
    const status = run.status;       // queued / in_progress / completed
    const conclusion = run.conclusion; // success / failure / cancelled / null

    if (status === 'queued') {
      setProgress(20, '排队中...');
    } else if (status === 'in_progress') {
      setProgress(50, '构建中...（解压 → 编译 → 上传）');
    } else if (status === 'completed') {
      if (conclusion === 'success') {
        setProgress(100, '构建完成！');
        showDownloadLink(token);
      } else {
        setProgress(0, '❌ 构建失败: ' + conclusion);
        document.getElementById('status').textContent = '❌ 构建失败，请检查 Actions 日志';
      }
      return; // 停止轮询
    }

    // 继续轮询
    pollTimer = setTimeout(() => pollRunStatus(token), 8000);
  } catch (e) {
    setProgress(0, '轮询出错: ' + e.message);
  }
}

// ── 4. 获取下载链接 ──
async function showDownloadLink(token) {
  try {
    const buildId = document.getElementById('build_id').value;
    const resp = await fetch(`https://api.github.com/repos/${REPO}/releases/tags/build-${buildId}`, {
      headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json' }
    });
    const data = await resp.json();
    if (data.assets && data.assets.length > 0) {
      const link = data.assets[0].browser_download_url;
      document.getElementById('downloadLink').href = link;
      document.getElementById('downloadArea').style.display = 'block';
      document.getElementById('status').textContent = '✅ 构建成功！';
    } else {
      document.getElementById('status').textContent = '⚠️ 构建成功但未找到发布文件，请手动前往 Releases 查看';
    }
  } catch (e) {
    document.getElementById('status').textContent = '⚠️ 获取下载链接失败: ' + e.message;
  }
}

// ── 进度条辅助 ──
function setProgress(percent, text) {
  const fill = document.getElementById('progressFill');
  fill.style.width = percent + '%';
  fill.textContent = percent + '%';
  document.getElementById('progressText').textContent = text;
}
</script>

</body>
</html>
