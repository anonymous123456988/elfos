<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>授权回调</title>
<style>
  body{background:#f6f8fa;display:flex;align-items:center;justify-content:center;height:100vh;font-family:-apple-system,sans-serif;margin:0}
  .box{background:#fff;padding:28px 36px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.08);text-align:center;color:#57606a;max-width:500px}
  .err{color:#cf222e;margin-top:12px}.ok{color:#1a7f37;margin-top:12px}
</style>
</head>
<body>
<div class="box" id="app">
  <div id="msg">正在完成授权，请稍候...</div>
  <div id="detail"></div>
</div>
<script>
const CLIENT_ID = "Ov23livXDpd3eWKlgFRi";   // 公开信息，可放前端
const REPO = "anonymous123456988/elfos";     // 中转 workflow 所在仓库
const BASE = "https://anonymous123456988.github.io/elfos";
const detail = document.getElementById("detail");
const msg = document.getElementById("msg);

// 你的 OAuth App 的 PAT（用于触发 workflow_dispatch）
// ⚠️ 这个 token 只需要 "actions:read + workflow" 权限，作用域极小
// 建议用 Fine-grained PAT，仅绑定 elfos 仓库
const GH_PAT = localStorage.getItem("elfos_pat");  // 用户自己填，不硬编码

function log(t, cls){ detail.innerHTML += t + "<br>"; if(cls) detail.className = cls; }

// 1. 取 code
const code = new URLSearchParams(location.search).get("code");
const state = new URLSearchParams(location.search).get("state");

if (!code) {
  detail.innerHTML = '<div class="err">❌ 未收到授权码</div>';
} else if (!GH_PAT) {
  // 让用户粘贴一个 PAT（只需 actions 权限）
  msg.textContent = "需要一次性 PAT 来触发构建";
  detail.innerHTML = `
    <input id="pat" placeholder="粘贴 Fine-grained PAT" style="width:100%;padding:8px;margin-top:8px">
    <button onclick="startExchange()" style="margin-top:8px;padding:8px 16px;background:#1f883d;color:#fff;border:none;border-radius:6px;cursor:pointer">继续</button>
    <div style="font-size:12px;margin-top:8px;color:#57606a">PAT 仅存本地，需 Actions: Read and write 权限</div>`;
} else {
  startExchange();
}

async function startExchange() {
  const pat = document.getElementById("pat")?.value;
  if (pat) { localStorage.setItem("elfos_pat", pat); }

  log("① 触发 token 交换 workflow...");

  // 触发 oauth-exchange workflow
  const disp = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/oauth-exchange.yml/dispatches`, {
    method: "POST",
    headers: { "Authorization": `Bearer ${localStorage.getItem("elfos_pat")}`, "Accept": "application/vnd.github+json", "Content-Type":"application/json" },
    body: JSON.stringify({ ref: "main", inputs: { code, state } })
  });

  if (disp.status !== 204) {
    log("❌ 触发失败: " + disp.status, "err");
    return;
  }
  log("  已触发 ✓", "ok");

  // 轮询等待 workflow 完成
  log("② 等待 token 生成（约 10-30 秒）...");
  pollRun();
}

async function pollRun() {
  const pat = localStorage.getItem("elfos_pat");
  for (let i = 0; i < 20; i++) {
    await new Promise(r => setTimeout(r, 5000));

    // 找最新的 oauth-exchange run
    const runs = await fetch(`https://api.github.com/repos/${REPO}/actions/runs?per_page=10`, {
      headers: { "Authorization": `Bearer ${pat}`, "Accept": "application/vnd.github+json" }
    }).then(r => r.json());

    const run = runs.workflow_runs?.find(r => r.name === "OAuth Token Exchange" && r.status === "completed");
    if (run) {
      if (run.conclusion !== "success") {
        log("❌ 交换失败，请重试", "err");
        return;
      }
      // 从 step summary 里提取 token（这里简化为重新调 API 取 logs 不可行，改用 artifact）
      // 实际做法：让 workflow 把 token 写到 Gist 或 Issue，这里我们用一个隐藏的 artifact
      log("③ 读取 token...");
      const token = await readTokenFromRun(run.id, pat);
      if (token) {
        localStorage.setItem("elfos_token", token);
        detail.innerHTML += '<div class="ok">✅ 授权成功！正在返回...</div>';
        setTimeout(() => location.href = BASE + "/build.html", 800);
      } else {
        log("❌ 无法读取 token，请检查 workflow 日志", "err");
      }
      return;
    }
  }
  log("⏱️ 超时，请刷新重试", "err");
}

// 从 workflow run 的 log 里提取 token（通过 jobs API）
async function readTokenFromRun(runId, pat) {
  const jobs = await fetch(`https://api.github.com/repos/${REPO}/actions/runs/${runId}/jobs`, {
    headers: { "Authorization": `Bearer ${pat}`, "Accept": "application/vnd.github+json" }
  }).then(r => r.json());

  const logUrl = jobs.jobs?.[0]?.steps?.find(s => s.name.includes("Write token"))?.log_url;
  if (!logUrl) return null;

  const logText = await fetch(logUrl, { headers: { "Authorization": `Bearer ${pat}` } }).then(r => r.text());
  // token 写在 step summary 里，格式是 gho_xxx 一行
  const m = logText.match(/gho_[A-Za-z0-9]+/);
  return m ? m[0] : null;
}
</script>
</body>
</html>
